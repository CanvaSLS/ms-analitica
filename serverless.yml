# ms-analitica · semáforo de riesgo · consumidor (SQS) + API protegida
service: ms-analitica

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 256
  timeout: 30                 # la cola debe tener VisibilityTimeout >= timeout (aquí 180 s)
  logRetentionInDays: 14
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    SERVICE_NAME: ms-analitica
    T_INDICADORES: sp_indicadores
    TOPIC_ARN: arn:aws:sns:${aws:region}:${aws:accountId}:sp-eventos-${sls:stage}

custom:
  auth:
    arn: arn:aws:lambda:${aws:region}:${aws:accountId}:function:ms-auth-${sls:stage}-autorizar
    type: token
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 0

package:
  patterns:
    - '!**'
    - '*.py'

functions:
  evaluarRiesgo:               # consumidor: SNS -> SQS -> esta Lambda
    handler: handler.evaluar_riesgo
    events:
      - sqs:
          arn: { Fn::GetAtt: [ColaAnalitica, Arn] }
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
  obtenerIndicadores:
    handler: handler.obtener_indicadores
    events:
      - http: { path: 'analitica/alumnos/{alumno_id}', method: get, cors: true, authorizer: "${self:custom.auth}" }
  consultarRiesgo:
    handler: handler.consultar_riesgo
    events:
      - http: { path: analitica/riesgo, method: get, cors: true, authorizer: "${self:custom.auth}" }
  resumenRiesgo:
    handler: handler.resumen
    events:
      - http: { path: analitica/resumen, method: get, cors: true, authorizer: "${self:custom.auth}" }

resources:
  Resources:
    TIndicadores:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: sp_indicadores
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: alumno_id, AttributeType: S }
          - { AttributeName: tenant_nivel, AttributeType: S }
          - { AttributeName: riesgo_orden, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: alumno_id, KeyType: RANGE }
        GlobalSecondaryIndexes:
          - IndexName: gsi_riesgo
            KeySchema:
              - { AttributeName: tenant_nivel, KeyType: HASH }
              - { AttributeName: riesgo_orden, KeyType: RANGE }
            Projection: { ProjectionType: ALL }

    # ---- Cola propia + DLQ: agregar un consumidor NO toca el código de nadie más
    ColaAnalitica:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sp-analitica-${sls:stage}
        VisibilityTimeout: 180
        RedrivePolicy:
          deadLetterTargetArn: { Fn::GetAtt: [ColaAnaliticaDLQ, Arn] }
          maxReceiveCount: 3
    ColaAnaliticaDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sp-analitica-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    PoliticaColaAnalitica:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [{ Ref: ColaAnalitica }]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: sns.amazonaws.com }
              Action: sqs:SendMessage
              Resource: { Fn::GetAtt: [ColaAnalitica, Arn] }
              Condition:
                ArnEquals:
                  aws:SourceArn: ${self:provider.environment.TOPIC_ARN}
    SuscripcionAnalitica:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: ${self:provider.environment.TOPIC_ARN}
        Protocol: sqs
        Endpoint: { Fn::GetAtt: [ColaAnalitica, Arn] }
        FilterPolicyScope: MessageAttributes
        FilterPolicy:
          evento: [NotaPublicada, EntregaRegistrada]     # NO incluye AlumnoEnRiesgo -> sin bucles
    AlarmaDLQAnalitica:          # monitoreo proactivo: avisa en cuanto algo cae a la DLQ
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: sp-analitica-dlq-con-mensajes-${sls:stage}
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions: [{ Name: QueueName, Value: { Fn::GetAtt: [ColaAnaliticaDLQ, QueueName] } }]
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    GatewayResponse4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_4XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
    GatewayResponse5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseType: DEFAULT_5XX
        RestApiId: { Ref: ApiGatewayRestApi }
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
